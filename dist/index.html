<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120d08" />
    <meta name="description" content="An interactive captain's journal rendered in WebGL." />
    <title>Interactive Captain's Journal</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script type="module" crossorigin src="/assets/index-lSO9kDaH.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dlr8rlV7.css">
  </head>
  <body>
    <main class="experience" aria-label="Interactive captain's journal">
      <canvas id="scene" aria-hidden="true"></canvas>

      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="light-leak" aria-hidden="true"></div>

      <nav class="chapter-rail" aria-label="Chapters">
        <span class="rail-label">Captain's Log</span>
        <ol>
          <li class="active">01</li><li>02</li><li>03</li><li>04</li><li>05</li>
          <li>06</li><li>07</li><li>08</li><li>09</li><li>10</li>
        </ol>
      </nav>

      <section class="photo-dock" aria-label="Journal editing controls">
        <div class="photo-strip" aria-label="Uploaded voyage photos">
          <p class="photo-strip__empty">Your voyage photos will appear here</p>
        </div>
        <form class="page-editor" aria-label="Current page editor">
          <div class="page-editor__top">
            <strong>Edit Current Page</strong>
            <button class="page-editor__close" type="button" aria-label="Close editor">×</button>
          </div>
          <p class="editor-target">Editing right page</p>
          <label>
            <span>Title</span>
            <input class="editor-title" type="text" maxlength="80" />
          </label>
          <label>
            <span>Caption</span>
            <input class="editor-caption" type="text" maxlength="80" />
          </label>
          <label>
            <span>Quote</span>
            <textarea class="editor-quote" rows="3" maxlength="180"></textarea>
          </label>
          <button class="utility-button editor-media" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM8 10l3 3 2-2 3 3M8 8h.01" /></svg>
            <span>Place Media</span>
          </button>
          <input class="editor-media-input" type="file" accept="image/*,video/*" hidden />
        </form>
        <div class="utility-controls">
          <button class="utility-button add-photo" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span>Add Photo</span>
          </button>
          <button class="utility-button edit-page" type="button" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4" /></svg>
            <span>Edit Page</span>
          </button>
          <button class="utility-button sequence-button" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
            <span>Pause</span>
          </button>
          <button class="utility-button pov-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Zm9 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /></svg>
            <span>Right POV</span>
          </button>
          <button class="utility-button download-video" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" /></svg>
            <span>Record Video</span>
          </button>
          <button class="utility-button settings-button" type="button" aria-label="Change time of day">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
            <span>Morning</span>
          </button>
          <button class="utility-button music-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 9l11-2M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm11-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
            <span>Music</span>
          </button>
          <button class="utility-button close-book" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm0 0v13a3 3 0 0 0 3 3M9 8h6"/></svg>
            <span>Close Book</span>
          </button>
          <input class="photo-input" type="file" accept="image/*,video/*" multiple hidden />
        </div>
      </section>

      <div class="toast" role="status" aria-live="polite"></div>

      <section class="story-ui" aria-label="Book controls">
        <div class="chapter" aria-live="polite">
          <span class="chapter__index">01</span>
          <span class="chapter__rule"></span>
          <div>
            <small>Chapter</small>
            <strong class="chapter__title">The Journey Begins</strong>
          </div>
        </div>

        <div class="controls controls--side">
          <button class="control control--prev" type="button" aria-label="Previous page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            <span>Prev Page</span>
          </button>
          <p><span class="page-current">01</span><i></i><span class="page-total">50</span></p>
          <button class="control control--next" type="button" aria-label="Next page">
            <span>Next Page</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </button>
        </div>

        <p class="hint"><span></span> Scroll or Drag to Explore</p>
      </section>

      <div class="loader" role="status" aria-label="Loading the archive">
        <div class="loader__monogram">P</div>
        <p>Unrolling the chart</p>
        <div class="loader__track"><span></span></div>
      </div>

      <noscript>This experience requires JavaScript and WebGL.</noscript>
    </main>
  </body>
</html>
